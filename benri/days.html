<body>
<div class="wrap">
    <header>
        <h1>📅 日数計算</h1>
        <p>「あと何日？」も「何日間ある？」もすぐ分かります</p>
    </header>

    <div class="card">
        <h2>🎯 目標の日まであと何日？</h2>
        <label for="target">目標の日</label>
        <input type="date" id="target">
        <div class="result" id="result-target">日付を選んでください</div>
    </div>

    <div class="card">
        <h2>↔️ 2つの日付の間は何日？</h2>
        <label for="from">開始日</label>
        <input type="date" id="from">
        <label for="to">終了日</label>
        <input type="date" id="to">
        <div class="result" id="result-between">日付を選んでください</div>
    </div>

    </div>

</div>

<script>
    function parseDate(value) {
        if (!value) return null;
        const parts = value.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
    }
    function todayDate() {
        const now = new Date();
        return new Date(now.getFullYear(), now.getMonth(), now.getDate());
    }
    function diffDays(a, b) {
        return Math.round((b - a) / 86400000);
    }
    function formatDate(d) {
        const week = ['日', '月', '火', '水', '木', '金', '土'][d.getDay()];
        return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${week}）`;
    }

    const targetEl = document.getElementById('target');
    const resultTarget = document.getElementById('result-target');
    function calcTarget() {
        const target = parseDate(targetEl.value);
        if (!target) { resultTarget.innerHTML = "日付を選んでください"; return; }
        const diff = diffDays(todayDate(), target);
        if (diff > 0) {
            resultTarget.innerHTML = `あと ${diff} 日<small>${formatDate(target)} まで</small>`;
        } else if (diff === 0) {
            resultTarget.innerHTML = `今日です！<small>${formatDate(target)}</small>`;
        } else {
            resultTarget.innerHTML = `${Math.abs(diff)} 日過ぎました<small>${formatDate(target)} から</small>`;
        }
    }
    targetEl.addEventListener('change', calcTarget);
    targetEl.addEventListener('input', calcTarget);

    const fromEl = document.getElementById('from');
    const toEl = document.getElementById('to');
    const resultBetween = document.getElementById('result-between');
    function calcBetween() {
        const from = parseDate(fromEl.value);
        const to = parseDate(toEl.value);
        if (!from || !to) { resultBetween.innerHTML = "日付を選んでください"; return; }
        const diff = diffDays(from, to);
        if (diff >= 0) {
            resultBetween.innerHTML = `${diff} 日間<small>両日を含むと ${diff + 1} 日です</small>`;
        } else {
            resultBetween.innerHTML = `${Math.abs(diff)} 日間<small>終了日が開始日より前になっています（両日を含むと ${Math.abs(diff) + 1} 日）</small>`;
        }
    }
    [fromEl, toEl].forEach((el) => {
        el.addEventListener('change', calcBetween);
        el.addEventListener('input', calcBetween);
    });

    // 開始日の初期値は今日
    const t = todayDate();
    const iso = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`;
    fromEl.value = iso;
</script>

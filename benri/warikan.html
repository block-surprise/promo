    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #333; --accent-color: #007aff; }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 40px 20px; line-height: 1.6;
        }
        .wrap { max-width: 560px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; }
        header p { color: #666; margin: 0; }
        .card {
            background: var(--card-bg); border-radius: 12px; padding: 28px 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eee;
        }
        label { display: block; font-weight: bold; font-size: 0.9rem; margin: 18px 0 6px; }
        label:first-child { margin-top: 0; }
        input, select {
            width: 100%; padding: 12px; font-size: 1.1rem; border: 1px solid #ddd;
            border-radius: 8px; box-sizing: border-box; background: #fff;
        }
        .result {
            margin-top: 26px; background: #f0f7ff; border-radius: 10px; padding: 20px; text-align: center;
        }
        .result .per { font-size: 2rem; font-weight: 900; color: var(--accent-color); }
        .result .sub { font-size: 0.9rem; color: #666; margin-top: 8px; }
        .ad-slot { text-align: center; margin: 26px auto 0; min-height: 50px; }
        footer { text-align: center; margin-top: 40px; font-size: 0.8rem; color: #999; }
        footer a { color: #999; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <h1>💴 割り勘計算</h1>
        <p>金額と人数を入れるだけで、一人あたりが分かります</p>
    </header>

    <div class="card">
        <label for="total">合計金額（円）</label>
        <input type="number" id="total" inputmode="numeric" placeholder="例：12000" min="0">

        <label for="people">人数</label>
        <input type="number" id="people" inputmode="numeric" placeholder="例：4" min="1">

        <label for="round">端数の処理</label>
        <select id="round">
            <option value="100up">100円単位で切り上げ（集めやすい）</option>
            <option value="10up">10円単位で切り上げ</option>
            <option value="1up">1円単位で切り上げ</option>
            <option value="exact">端数そのまま</option>
            <option value="1down">1円単位で切り捨て</option>
        </select>

        <div class="result" id="result">
            <div class="per">― 円</div>
            <div class="sub">金額と人数を入力してください</div>
        </div>
    </div>

    <div class="ad-slot">
        <script src="https://adm.shinobi.jp/s/8883b8c96c219279b7215cf3521e8aed"></script>
    </div>

    <footer>
        <p><a href="index.html">← みんなの便利ツールへもどる</a>　|　<a href="../index.html">運営サイト一覧</a></p>
        <p>&copy; 2026 Block Surprise <a href="../privacy.html">プライバシーポリシー</a></p>
    </footer>
</div>

<script>
    const totalEl = document.getElementById('total');
    const peopleEl = document.getElementById('people');
    const roundEl = document.getElementById('round');
    const resultEl = document.getElementById('result');

    function calc() {
        const total = parseFloat(totalEl.value);
        const people = parseInt(peopleEl.value, 10);
        if (!total || total <= 0 || !people || people <= 0) {
            resultEl.innerHTML = '<div class="per">― 円</div><div class="sub">金額と人数を入力してください</div>';
            return;
        }
        const raw = total / people;
        const mode = roundEl.value;
        let per;
        if (mode === '100up') per = Math.ceil(raw / 100) * 100;
        else if (mode === '10up') per = Math.ceil(raw / 10) * 10;
        else if (mode === '1up') per = Math.ceil(raw);
        else if (mode === '1down') per = Math.floor(raw);
        else per = Math.round(raw * 100) / 100;

        const collected = per * people;
        const diff = collected - total;
        let diffText;
        if (diff > 0) diffText = `集めると ${diff.toLocaleString()} 円余ります`;
        else if (diff < 0) diffText = `集めると ${Math.abs(diff).toLocaleString()} 円不足します`;
        else diffText = "ぴったり集まります";

        resultEl.innerHTML =
            `<div class="per">一人 ${per.toLocaleString()} 円</div>` +
            `<div class="sub">${people}人で集めると合計 ${collected.toLocaleString()} 円（請求額 ${total.toLocaleString()} 円）<br>${diffText}</div>`;
    }

    [totalEl, peopleEl, roundEl].forEach((el) => {
        el.addEventListener('input', calc);
        el.addEventListener('change', calc);
    });
</script>
</body>

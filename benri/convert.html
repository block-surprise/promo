    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #333; --accent-color: #007aff; }
        body {

<body>
<div class="wrap">
    <header>
        <h1>🔁 単位変換</h1>
        <p>長さ・重さ・温度・面積をまとめて変換</p>
    </header>

    <div class="card">
        <div class="tabs" id="tabs"></div>

        <label for="value">変換したい値</label>
        <input type="number" id="value" inputmode="decimal" placeholder="例：10">

        <label for="from">変換元の単位</label>
        <select id="from"></select>

        <div class="arrow">⬇️</div>

        <label for="to">変換先の単位</label>
        <select id="to"></select>

        <div class="result" id="result">値を入力してください</div>
    </div>

    <div class="ad-slot">

    </div>

        <p>&copy; 2026 Block Surprise <a href="../privacy.html">プライバシーポリシー</a></p>
    </footer>
</div>

<script>
    // 各カテゴリ：基準単位への換算係数（温度だけ特別処理）
    const CATEGORIES = {
        length: {
            label: "長さ",
            units: {
                "ミリメートル (mm)": 0.001,
                "センチメートル (cm)": 0.01,
                "メートル (m)": 1,
                "キロメートル (km)": 1000,
                "インチ": 0.0254,
                "フィート": 0.3048,
                "マイル": 1609.344
            }
        },
        weight: {
            label: "重さ",
            units: {
                "グラム (g)": 1,
                "キログラム (kg)": 1000,
                "トン (t)": 1000000,
                "ポンド (lb)": 453.59237,
                "オンス (oz)": 28.349523125
            }
        },
        temp: {
            label: "温度",
            units: {
                "摂氏 (°C)": "c",
                "華氏 (°F)": "f",
                "ケルビン (K)": "k"
            }
        },
        area: {
            label: "面積",
            units: {
                "平方メートル (㎡)": 1,
                "坪": 3.305785,
                "畳（中京間）": 1.6562,
                "アール (a)": 100,
                "ヘクタール (ha)": 10000
            }
        }
    };

    let currentCategory = "length";
    const tabsEl = document.getElementById('tabs');
    const valueEl = document.getElementById('value');
    const fromEl = document.getElementById('from');
    const toEl = document.getElementById('to');
    const resultEl = document.getElementById('result');

    function buildTabs() {
        tabsEl.innerHTML = "";
        Object.keys(CATEGORIES).forEach((key) => {
            const btn = document.createElement('button');
            btn.className = "tab" + (key === currentCategory ? " active" : "");
            btn.innerText = CATEGORIES[key].label;
            btn.onclick = () => { currentCategory = key; buildTabs(); buildUnits(); convert(); };
            tabsEl.appendChild(btn);
        });
    }

    function buildUnits() {
        const units = Object.keys(CATEGORIES[currentCategory].units);
        fromEl.innerHTML = "";
        toEl.innerHTML = "";
        units.forEach((u) => {
            fromEl.appendChild(new Option(u, u));
            toEl.appendChild(new Option(u, u));
        });
        if (units.length > 1) toEl.selectedIndex = 1;
    }

    function formatNumber(n) {
        if (!isFinite(n)) return "―";
        const rounded = Math.round(n * 10000) / 10000;
        return rounded.toLocaleString(undefined, { maximumFractionDigits: 4 });
    }

    function convertTemp(value, from, to) {
        let c;
        if (from === "c") c = value;
        else if (from === "f") c = (value - 32) * 5 / 9;
        else c = value - 273.15;
        if (to === "c") return c;
        if (to === "f") return c * 9 / 5 + 32;
        return c + 273.15;
    }

    function convert() {
        const value = parseFloat(valueEl.value);
        if (isNaN(value)) { resultEl.innerText = "値を入力してください"; return; }
        const cat = CATEGORIES[currentCategory];
        let out;
        if (currentCategory === "temp") {
            out = convertTemp(value, cat.units[fromEl.value], cat.units[toEl.value]);
        } else {
            out = value * cat.units[fromEl.value] / cat.units[toEl.value];
        }
        resultEl.innerText = `${value.toLocaleString()} ${fromEl.value} ＝ ${formatNumber(out)} ${toEl.value}`;
    }

    [valueEl, fromEl, toEl].forEach((el) => {
        el.addEventListener('input', convert);
        el.addEventListener('change', convert);
    });

    buildTabs();
    buildUnits();
</script>

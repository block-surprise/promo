    <style>
        :root { --bg-color: #f8f9fa; --card-bg: #ffffff; --text-color: #333; --accent-color: #007aff; }
        body {
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 40px 20px; line-height: 1.6;
        }
        .wrap { max-width: 560px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        h1 { font-size: 1.8rem; margin-bottom: 8px; }
        header p { color: #666; margin: 0; }
        .card {
            background: var(--card-bg); border-radius: 12px; padding: 28px 24px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #eee;
        }
        #password {
            background: #f0f7ff; border-radius: 10px; padding: 18px 14px; text-align: center;
            font-family: "SFMono-Regular", Consolas, monospace; font-size: 1.25rem; font-weight: bold;
            word-break: break-all; min-height: 1.5em; color: var(--accent-color);
        }
        .btn {
            display: block; width: 100%; margin-top: 14px; padding: 13px;
            background: var(--accent-color); color: #fff; border: none; border-radius: 8px;
            font-size: 1rem; font-weight: bold; cursor: pointer;
        }
        .btn:hover { opacity: 0.85; }
        .btn.copy { background: #333; }
        .options { margin-top: 22px; }
        .options label { display: block; margin: 10px 0; font-size: 0.95rem; cursor: pointer; }
        .options input[type="checkbox"] { margin-right: 8px; transform: scale(1.15); }
        .len-row { display: flex; align-items: center; gap: 14px; margin: 6px 0 14px; }
        .len-row input[type="range"] { flex: 1; }
        .len-row strong { min-width: 3.2em; text-align: right; }
        .note { font-size: 0.82rem; color: #999; margin-top: 18px; }
        .ad-slot { text-align: center; margin: 26px auto 0; min-height: 50px; }
        footer { text-align: center; margin-top: 40px; font-size: 0.8rem; color: #999; }
        footer a { color: #999; }

<body>
<div class="wrap">
    <header>
        <h1>🔐 パスワード生成</h1>
        <p>安全なランダムパスワードをその場で作ります</p>
    </header>

    <div class="card">
        <div id="password">生成ボタンを押してください</div>
        <button class="btn" id="btn-generate">新しいパスワードを生成</button>
        <button class="btn copy" id="btn-copy">コピーする</button>

        <div class="options">
            <div class="len-row">
                <span>長さ</span>
                <input type="range" id="length" min="8" max="32" value="16">
                <strong><span id="length-val">16</span>文字</strong>
            </div>
            <label><input type="checkbox" id="opt-lower" checked>英小文字（a-z）</label>
            <label><input type="checkbox" id="opt-upper" checked>英大文字（A-Z）</label>
            <label><input type="checkbox" id="opt-number" checked>数字（0-9）</label>
            <label><input type="checkbox" id="opt-symbol">記号（!@#$% など）</label>
            <label><input type="checkbox" id="opt-exclude">紛らわしい文字を除く（l, 1, O, 0 など）</label>
        </div>

        <p class="note">※ 生成はあなたの端末の中だけで行われ、パスワードがサーバーに送られることはありません。作ったパスワードはパスワード管理アプリなどに保存して使い回さないようにしましょう。</p>
    </div>

    <div class="ad-slot">
        <script src="https://adm.shinobi.jp/s/8883b8c96c219279b7215cf3521e8aed"></script>
    </div>

    <footer>
        <p><a href="index.html">← みんなの便利ツールへもどる</a>　|　<a href="../index.html">運営サイト一覧</a></p>
        <p>&copy; 2026 Block Surprise <a href="../privacy.html">プライバシーポリシー</a></p>
    </footer>
</div>

<script>
    const SETS = {
        lower: "abcdefghijklmnopqrstuvwxyz",
        upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        number: "0123456789",
        symbol: "!@#$%^&*()-_=+[]{}<>?"
    };
    const AMBIGUOUS = /[l1IO0o]/g;

    function generate() {
        let chars = "";
        if (document.getElementById('opt-lower').checked) chars += SETS.lower;
        if (document.getElementById('opt-upper').checked) chars += SETS.upper;
        if (document.getElementById('opt-number').checked) chars += SETS.number;
        if (document.getElementById('opt-symbol').checked) chars += SETS.symbol;
        if (document.getElementById('opt-exclude').checked) chars = chars.replace(AMBIGUOUS, "");

        const length = parseInt(document.getElementById('length').value, 10);
        const out = document.getElementById('password');
        if (!chars) {
            out.innerText = "文字の種類を1つ以上選んでください";
            return;
        }
        const buf = new Uint32Array(length);
        crypto.getRandomValues(buf);
        let pw = "";
        for (let i = 0; i < length; i++) {
            pw += chars[buf[i] % chars.length];
        }
        out.innerText = pw;
    }

    document.getElementById('length').addEventListener('input', (e) => {
        document.getElementById('length-val').innerText = e.target.value;
    });
    document.getElementById('btn-generate').addEventListener('click', generate);
    document.querySelectorAll('.options input[type="checkbox"]').forEach((el) => {
        el.addEventListener('change', generate);
    });
    document.getElementById('btn-copy').addEventListener('click', async (e) => {
        const pw = document.getElementById('password').innerText;
        if (!pw || pw.includes("選んでください") || pw.includes("生成ボタン")) return;
        try {
            await navigator.clipboard.writeText(pw);
            e.target.innerText = "コピーしました！";
            setTimeout(() => { e.target.innerText = "コピーする"; }, 1600);
        } catch (err) {
            e.target.innerText = "長押しでコピーしてください";
        }
    });

    generate();
</script>
</body>

    <style>

<body>
<div class="wrap">
    <header>
        <h1>🔮 今日の運勢占い</h1>
        <p>運勢は日付で決まります。今日一日、何度見ても同じ結果です</p>
    </header>

    <div class="card">
        <div id="date-line"></div>
        <div id="fortune">？？？</div>
        <div class="row">
            <div class="item"><span>ラッキーアイテム</span><strong id="lucky-item">---</strong></div>
            <div class="item"><span>ラッキーカラー</span><strong id="lucky-color">---</strong></div>
            <div class="item"><span>ラッキーモブ</span><strong id="lucky-mob">---</strong></div>
        </div>
        <p id="advice">ボタンを押して、今日の運勢を占ってみよう！</p>
        <button class="btn" id="btn-draw">運勢を占う</button>
    </div>
    <p class="note">※ 占いはエンタメです。凶が出ても落ち込まないでね。</p>

    </footer>
</div>

<script>
    // 日付を種にした疑似乱数（同じ日は同じ結果になる）
    function seededRandom(seed) {
        let x = seed;
        return function() {
            x = (x * 1103515245 + 12345) % 2147483648;
            return x / 2147483648;
        };
    }

    const FORTUNES = [
        { name: "大吉", weight: 12, advice: "今日は最強の一日！ダイヤ掘りもテストも、思い切って挑戦するとうまくいくかも。" },
        { name: "中吉", weight: 22, advice: "いい流れが来ています。後回しにしていたことを片付けるチャンス。" },
        { name: "小吉", weight: 24, advice: "小さなラッキーが重なる日。落とし物や忘れ物に気をつければ完璧。" },
        { name: "吉", weight: 20, advice: "安定の一日。コツコツ進めたことが、ちゃんと身を結びます。" },
        { name: "末吉", weight: 14, advice: "後半から運気アップ。午前中は慎重に、午後は大胆にいこう。" },
        { name: "凶", weight: 8, advice: "今日は無理せず安全第一。溶岩の近くでは特に慎重に…。明日はきっと上がります。" }
    ];
    const ITEMS = ["ダイヤモンド", "金のリンゴ", "エリトラ", "トライデント", "エンチャントの本", "ネザライトインゴット", "トーテム", "コンパス", "バケツ", "松明", "エンダーパール", "花火ロケット"];
    const COLORS = ["ダイヤブルー", "エメラルドグリーン", "レッドストーンレッド", "ゴールドイエロー", "ラピスラズリブルー", "アメジストパープル", "クォーツホワイト", "コッパーオレンジ"];
    const MOBS = ["村人", "猫", "オオカミ", "アレイ", "アイアンゴーレム", "ミツバチ", "ウーパールーパー", "カメ"];

    function draw() {
        const now = new Date();
        const seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
        const rand = seededRandom(seed);

        document.getElementById('date-line').innerText =
            `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日の運勢`;

        // 重み付きで運勢を決める
        const totalWeight = FORTUNES.reduce((s, f) => s + f.weight, 0);
        let r = rand() * totalWeight;
        let fortune = FORTUNES[FORTUNES.length - 1];
        for (const f of FORTUNES) {
            r -= f.weight;
            if (r <= 0) { fortune = f; break; }
        }

        document.getElementById('fortune').innerText = fortune.name;
        document.getElementById('lucky-item').innerText = ITEMS[Math.floor(rand() * ITEMS.length)];
        document.getElementById('lucky-color').innerText = COLORS[Math.floor(rand() * COLORS.length)];
        document.getElementById('lucky-mob').innerText = MOBS[Math.floor(rand() * MOBS.length)];
        document.getElementById('advice').innerText = fortune.advice;
        document.getElementById('btn-draw').innerText = "今日の運勢はこれで確定！";
    }

    document.getElementById('btn-draw').addEventListener('click', draw);
</script>
</body>
